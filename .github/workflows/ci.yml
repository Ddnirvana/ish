name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build, unit, and regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js 22.19
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install tmux on macOS if missing
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux >/dev/null 2>&1; then brew install tmux; fi

      - name: Install tmux and vim on Linux if missing
        if: runner.os == 'Linux'
        run: |
          if ! command -v zsh >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y zsh; fi
          if ! command -v tmux >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y tmux; fi
          if ! command -v vim >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y vim; fi

      - name: Install pinned dependencies
        run: npm ci

      - name: Print runner environment
        run: |
          uname -a
          node --version
          command -v zsh tmux vim script || true
          zsh --version || true
          tmux -V || true
          sysctl -n hw.ncpu 2>/dev/null || nproc
          ulimit -a

      - name: Build
        run: npm run build

      - name: Unit and regression tests (serial, deterministic)
        shell: bash
        run: |
          set -o pipefail
          npm run test:serial 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Diagnose test failures
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/test-output.log"
          if [ -f "$log" ]; then
            {
              echo "## Test output tail"
              echo '```'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 120 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=test-output.log,title=test failure tail::$msg"
          else
            echo "## No test log was produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Scan for credential-like patterns
        shell: bash
        run: |
          scan() {
            local pattern="$1"
            if command -v rg >/dev/null 2>&1; then
              rg -n --hidden -g '!.git' -g '!node_modules' -g '!dist' "$pattern" .
            else
              find . \( -path './.git' -o -path './node_modules' -o -path './dist' \) -prune -o -type f -print0 | xargs -0 grep -InE "$pattern"
            fi
          }
          if scan 'sk-[A-Za-z0-9]{24,}'; then
            echo "::error::credential-like pattern (sk-...) found in the tree"
            exit 1
          fi
          # [k] keeps this file from matching its own scan pattern text.
          if scan 'DEEPSEEK_API_KEY=s[k]|OPENAI_API_KEY=s[k]'; then
            echo "::error::credential-like pattern (provider API key) found in the tree"
            exit 1
          fi

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-output-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore

  soak:
    name: 200-iteration soak regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js 22.19
        uses: actions/setup-node@v5
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Install zsh on Linux if missing
        run: |
          if ! command -v zsh >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y zsh; fi

      - name: Print runner environment
        run: |
          uname -a
          node --version
          command -v zsh tmux vim script || true
          zsh --version || true
          tmux -V || true
          sysctl -n hw.ncpu 2>/dev/null || nproc
          ulimit -a

      - name: Build
        run: npm run build

      - name: Daily soak (200 iterations, durable jobs, daemon restarts)
        shell: bash
        run: |
          set -o pipefail
          npm run test:soak 2>&1 | tee "$RUNNER_TEMP/soak-output.log"

      - name: Diagnose soak failures
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/soak-output.log"
          if [ -f "$log" ]; then
            {
              echo "## Soak output tail"
              echo '```'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 120 "$log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error file=soak-output.log,title=soak failure tail::$msg"
          else
            echo "## No soak log was produced" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: soak-output
          path: ${{ runner.temp }}/soak-output.log
          if-no-files-found: ignore
